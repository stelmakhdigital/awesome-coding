# index/aliases.yaml — слова, которыми ищут запись, но которые не стоят у неё в тегах.
#
# Теги — названия, которыми запись называет себя сама. Алиасы — чужая лексика:
# «upsert» в тексте есть, в тегах его нет. Алиас указывает конкретные id, потому
# что одно слово обычно относится к разным разделам (upsert — и про ON CONFLICT,
# и про Outbox, и про Room).
#
# Проверяется валидатором (check_aliases): ключ — в форме тегов (строчные,
# дефисы), не совпадает с тегом или id, список непустой и все id существуют.
#
# Синхронность с содержимым проверяет человек: алиас — это ответ на запрос, а не
# утверждение, что записи связаны. Тавтологии (слово уже в тексте записи) тут не
# нужны — их чинят тегом, иначе одно и то же живёт в двух местах.

aliases:
  bundling: [react-vite, react-heavy-widget]
  circuit-breaker: [arch-microservices, csharp-http-client]
  jail: [arch-code-sandbox]
  liveness: [go-metrics]
  frontend: [react-rules, react-decisions, react-feature-structure]
  deadlock: [database-transactions, go-goroutines, go-worker-pool]
  openid: [cicd-secrets]
  rtl: [react-testing]
  percentile: [shared-observability]
  upsert: [database-transactions, kotlin-room, messaging-outbox]

# Русские запросы к латинскому словарю тегов. Теги в каталоге — латиница
# (1129 тегов, ни одного кириллического), а ищут по-русски: «остановка» против
# shutdown в тегах не совпадёт никогда, морфология тут не поможет — дело в
# другом алфавите. Формы слова подбирает same_stem («отмена» покрывает
# «отменить»), поэтому ключ даётся в именительном падеже единственного числа.
  сигнал: [go-graceful-shutdown]
  остановка: [go-graceful-shutdown]
  отмена: [go-context]
  таймаут: [go-context]
  постранично: [database-pagination]
  докерфайл: [cicd-docker]
  настройки: [shared-configuration]
  конфиг: [shared-configuration]
  права: [shared-security]
  доступ: [shared-security, shared-authentication]
  журнал: [shared-observability]
  трассировка: [go-tracing]
  воркер: [go-worker-pool, go-goroutines]
  поток: [llm-streaming, go-file-io]
  токен: [llm-streaming]  # у аутентификации «токены» есть в названии — алиас не нужен
  истечение: [database-redis]
  пул-воркеров: [go-worker-pool]
  инструмент: [llm-tool-calls]
  компонент: [react-components, react-testing]
  slow-client: [go-websocket, go-http-client, csharp-http-client]
  буферизация: [go-proxy, go-websocket]
