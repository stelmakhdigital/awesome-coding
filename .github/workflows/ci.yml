name: CI

on:
  push:
    branches: [master]
  pull_request:

# Минимальные права: пайплайн только читает репозиторий (cicd/rules.md).
permissions:
  contents: read

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Сторонние actions — по SHA (cicd/rules.md); версия в комментарии,
      # обновление — dependabot (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml

      # Сначала тесты туллинга: сломанный валидатор даёт зелёный `make validate`
      # из неправильных предпосылок (см. tools/test_tools.py).
      - name: Tooling tests
        run: make test

      - name: Validate (frontmatter + каталог + текст + ссылки)
        run: make validate

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install mermaid validator deps
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: Validate mermaid blocks
        run: make validate-mermaid

  # Код записей прогоняется через настоящие тулчейны. Матрица по языкам —
  # чтобы образы тянулись параллельно и лог одного языка читался отдельно.
  verify-snippets:
    name: verify code (${{ matrix.lang }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lang: [go, ts, tsx, js, python, bash, sh, c, sql, csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml

      # Разные verdicts: fail/fmt ломают сборку, deps/fragment — нет
      # (см. docs/FORMAT.md, «Что стоит за verified»).
      - name: Run record code through the toolchain
        run: python3 tools/verify_snippets.py --lang ${{ matrix.lang }} --jobs ${{ matrix.lang == 'csharp' && 2 || 4 }}
